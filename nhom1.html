
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vẻ đẹp của Minecraft</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101810;
            color: white;
            font-family: Arial, sans-serif;
            padding: 35px 5%;
        }

        h1 {
            text-align: center;
            font-size: clamp(28px, 5vw, 45px);
            margin-bottom: 35px;
            color: #b9f6a5;
            text-shadow: 0 0 20px #6cbb65;
        }

        .gallery {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            border-radius: 12px;
            transition: 0.4s;
            box-shadow: 0 5px 20px #0006;
        }

        .gallery img:first-child {
            grid-column: 1 / -1;
            height: 420px;
        }

        .gallery img:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px #8de06c66;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img:first-child {
                grid-column: auto;
                height: 250px;
            }

            .gallery img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <h1>Vẻ đẹp của Minecraft</h1>

    <div class="gallery">
        <img src="images.jfif" alt="Lâu đài Minecraft">
        <img src="images (1).jfif" alt="Núi Minecraft">
        <img src="images (2).jfif" alt="Rừng hoa anh đào Minecraft">
    </div>

</body>
</html>
